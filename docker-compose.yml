services:
  # 1. Dịch vụ Database (MongoDB)
  mongo:
    image: mongo:7.0
    container_name: taskflow-mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db 

  # 2. Dịch vụ Backend (Node.js)
  backend:
    build: ./be
    container_name: taskflow-backend
    volumes:
      - ./be:/app               
      - /app/node_modules       
    command: npm run dev       

    restart: always
    # ports: (nên ẩn tránh lộ port be mà cần vẫn call tới đc thông quan nginx)
    #   - "5002:5001" 
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/taskflow 
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=taskflow_jwt_secret_key_super_secure_2026
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo 
      - redis

  # 3. Dịch vụ Frontend (React + Nginx)
  frontend:
    build: ./fe
    container_name: taskflow-frontend
    restart: always
    ports:
      - "81:80" 
    depends_on:
      - backend
      
  
  # 4. dịch vụ Redis Cache
  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo_data:
